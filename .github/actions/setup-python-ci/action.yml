name: Set up Python CI
description: Reuse non-editable workspace wheels, with Cargo dependencies as a build fallback

inputs:
  python-version:
    description: Python version, including the free-threaded suffix when applicable
    required: true

runs:
  using: composite
  steps:
    - name: Install python
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        architecture: x64
        allow-prereleases: true

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Prepare wheel cache identity
      id: wheels
      shell: bash
      run: python "$GITHUB_ACTION_PATH/prepare-cache.py"

    - name: Install uv
      id: uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        # The helper hashes source contents, locks, Python ABI and build tools.
        # Its CI-only metadata overlay avoids fresh-checkout timestamp misses.
        cache-dependency-glob: ""
        cache-suffix: ci-wheels-${{ steps.wheels.outputs.cache-key }}
        prune-cache: true

    # A complete wheel hit needs no Cargo target download. On changed sources,
    # retain dependency compilation rather than rebuilding everything from zero.
    # The install itself is never skipped, even if either cache is incomplete.
    - name: Cache native build dependencies
      if: steps.uv.outputs.cache-hit != 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: |
          rust
          packages/biliass/rust
        shared-key: native-${{ inputs.python-version }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('**/pyproject.toml', 'uv.lock') }}
        env-vars: ImageOS PYO3 PYTHON MATURIN UV YUTTO_CI_BUILD_ENV_KEY
        cache-bin: false
